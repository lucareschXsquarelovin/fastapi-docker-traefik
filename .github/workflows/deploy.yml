name: Deploy to k3s

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/devops-weiterbildung:$IMAGE_TAG .
          docker push $ECR_REGISTRY/devops-weiterbildung:$IMAGE_TAG

      - name: Copy k8s manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/"
          target: "~/"

      - name: Apply manifests & update image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sed -i "s|PLACEHOLDER_IMAGE|${{ secrets.ECR_REGISTRY }}/devops-weiterbildung:${{ github.sha }}|g" ~/k8s/fastapi-deployment.yml
            sudo kubectl apply -f ~/k8s/
            sudo kubectl set image deployment/fastapi-app \
              fastapi=${{ secrets.ECR_REGISTRY }}/devops-weiterbildung:${{ github.sha }} \
              --namespace=default
