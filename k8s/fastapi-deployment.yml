apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: fastapi
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://fastapi:fastapi@postgres:5432/fastapi"
